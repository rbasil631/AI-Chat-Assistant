name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017/ai-chat-assistant-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm run install:all
      - name: Server tests (unit + integration against MongoDB)
        run: npm --prefix server test
      - name: Client tests
        run: npm --prefix client test
      - name: Build client
        run: npm run build
